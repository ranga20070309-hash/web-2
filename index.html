<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">||RANGA||</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <div id="cursor"></div>

    <div id="enter-screen">
        <p class="blink">click to enter...</p>
    </div>

    <div id="background-container">
        <div id="bg-motion-layer">
            <video id="bg-video" autoplay loop muted playsinline></video>
            <div id="background-img"></div>
        </div>
        <div id="background-overlay"></div>
    </div>

    <div id="rain-container"></div>

    <div id="main-content" class="hidden">
        <div id="audio-control-wrapper">
            <button id="audio-toggle">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <div class="volume-slider-container">
                <input type="range" id="volume-slider" min="0" max="100" value="50" />
            </div>
        </div>

        <div class="container">
            <h1 class="title glow" id="profile-name">||RANGA||</h1>
            <p class="subtitle glow" id="profile-title">Loading...</p>

            <div class="location">
                <i class="fa-solid fa-location-dot"></i>
                <span id="profile-location">Loading...</span>
            </div>

            <div class="discord-card">
                <div class="avatar-container">
                    <img src="" alt="Avatar" class="avatar" id="d-avatar" />
                    <div class="status-indicator" id="d-status-indicator"></div>
                </div>
                <div class="discord-info">
                    <div class="username-wrapper">
                        <span class="d-username" id="d-username">Loading...</span>
                        <div class="badges" id="d-badges">
                            <span style="margin-right: 4px; font-size: 1rem;">🔥</span>
                            <span style="color: red; font-weight: bold; font-size: 0.85rem; letter-spacing: 1px;">KONG</span>
                            <div style="background: rgba(255, 0, 0, 0.7); border-radius: 50%; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; margin-left: 5px;">
                                <i class="fa-solid fa-chevron-down" style="color: black; font-size: 0.6rem;"></i>
                            </div>
                        </div>
                    </div>
                    <div class="status-wrapper" style="display: flex; align-items: center; gap: 6px; margin-top: 5px;">
                        <img src="" id="d-status-icon" style="width: 20px; height: 20px; border-radius: 3px; display: none;" />
                        <span class="d-status-text" id="d-status-text" style="color: red !important;">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="social-links">
                <a href="#" target="_blank" class="social-icon" id="link-spotify"><i class="fa-brands fa-spotify"></i></a>
                <a href="#" target="_blank" class="social-icon" id="link-tiktok"><i class="fa-brands fa-tiktok"></i></a>
                <a href="#" target="_blank" class="social-icon" id="link-apple"><i class="fa-brands fa-apple"></i></a>
            </div>

            <div class="music-player">
                <div class="album-art">
                    <img src="https://ui-avatars.com/api/?name=Music&background=222&color=f00" alt="Album View" id="player-album-art" />
                </div>
                <div class="player-info">
                    <div class="song-title glow" id="song-title-text">Loading...</div>
                    <div class="progress-row">
                        <span id="current-time">0:00</span>
                        <div class="progress-bar-bg" id="progress-bar-bg">
                            <div class="progress-bar-fill" id="progress-bar-fill"></div>
                        </div>
                        <span id="total-time">0:00</span>
                        <div class="player-buttons">
                            <i class="fa-solid fa-backward-step"></i>
                            <i class="fa-solid fa-pause" id="play-pause-btn"></i>
                            <i class="fa-solid fa-forward-step"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="view-counter hidden" id="view-counter-box">
            <i class="fa-solid fa-eye"></i> <span id="views">10</span>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="" type="audio/mpeg" id="audio-source" />
    </audio>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
